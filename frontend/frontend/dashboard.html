<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduCRM | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="topbar">

        <h1>EduCRM</h1>

        <button id="logoutButton">
            Cerrar sesión
        </button>

    </header>


    <main>

        <h2>Panel de control</h2>

        <section class="dashboard-grid">

            <article class="dashboard-card">
                <h3>Alumnos</h3>
                <strong id="studentCount">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <h3>Clases</h3>
                <strong id="classCount">
                    0
                </strong>
            </article>

            <article class="dashboard-card">
                <h3>Asistencias</h3>
                <strong id="attendanceCount">
                    0
                </strong>
            </article>

        </section>


        <section>

            <h2>Alumnos</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nombre</th>
                        <th>Nivel</th>
                        <th>Email</th>
                    </tr>

                </thead>

                <tbody id="studentsTable">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
