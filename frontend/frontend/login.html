Z<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduCRM | Iniciar sesión</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>EduCRM</h1>

            <p>Gestión de profesores y academias</p>

            <form id="loginForm">

                <label for="username">
                    Usuario
                </label>

                <input
                    id="username"
                    type="text"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    id="password"
                    type="password"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

                <p id="errorMessage"></p>

            </form>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>

</html>
